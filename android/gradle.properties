org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Kotlin incremental caches cannot relativize a plugin's resolved D: path
# against the mapped G: workspace used by Windows native asset tooling.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
